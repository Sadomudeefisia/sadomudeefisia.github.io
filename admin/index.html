<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sa Domu De Efisia CMS</title>

<style>

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:#f5f5f5;
}

header{

background:#0a5c36;
color:white;
padding:20px;
font-size:28px;
font-weight:bold;

}

.container{

max-width:1200px;
margin:auto;
padding:30px;

}

.card{

background:white;
border-radius:12px;
padding:30px;
box-shadow:0 0 15px rgba(0,0,0,.1);

}

.grid{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;

}

.button{

display:block;
padding:20px;
background:#0a5c36;
color:white;
text-decoration:none;
border-radius:10px;
text-align:center;
font-size:20px;

}

.button:hover{

background:#0d7d49;

}

</style>

</head>

<body>

<header>

SA DOMU DE EFISIA CMS

</header>

<div class="container">

<div class="card">

<h2>Dashboard</h2>

<div class="grid">

<a class="button" href="#">📰 Nuovo Articolo</a>

<a class="button" href="#">📚 Tutti gli Articoli</a>

<a class="button" href="#">📷 Galleria</a>

<a class="button" href="#">📍 Esperienze</a>

<a class="button" href="#">🍝 Gastronomia</a>

<a class="button" href="#">🎭 Tradizioni</a>

<a class="button" href="#">❤️ Vivere in Sardegna</a>

<a class="button" href="#">⚙️ Impostazioni</a>

</div>

</div>

</div>

</body>

</html>
